server:
  port: 3001
  deploy_mode: private

auth:
  session_expiry_days: 7

database:
  url: "file:./data/vico.db"
  duckdb_url: "./data/vico.duckdb"


skills:
  scan_paths:
    - "../skills"
    - "./data/custom-skills"

memory:
  stm_window: 20
  ltm_auto_extract: true
  ltm_max_entries: 10000

rag:
  chunk_size: 512
  chunk_overlap: 64
  retrieval_top_k: 5
  embedder: "fastembed"

tool:
  timeout_ms: 30000

workspace:
  base_path: '~/vico'
  contained: true
  allowed_paths: []
  timeout_ms: 30000
  isolation: 'none'
