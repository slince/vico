server:
  port: 3001
  deploy_mode: private
  agent_engine: mastra  # 'mastra' 或 'legacy'，切换 Agent 引擎

auth:
  session_expiry_days: 7

database:
  path: "./data/vico.db"

skills:
  scan_paths:
    - "../skills"
    - "./data/custom-skills"

memory:
  stm_window: 20
  ltm_auto_extract: true
  ltm_max_entries: 10000

rag:
  chunk_size: 512
  chunk_overlap: 64
  retrieval_top_k: 5
  embedder: local
  embedder_model: "Xenova/all-MiniLM-L6-v2"

llm:
  models: []
