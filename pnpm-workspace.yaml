packages:
  - "packages/*"
  - "examples/*"
  - "vico/*"

# workspace 依赖已解耦为严格分层：package.json 声明、源码 value import、
# type-only import 三层均无循环依赖，因此无需 ignoreWorkspaceCycles 放行。

# 放行刚发布（未满 24h）的 assistant-ui 相关包，保留其余包的供应链保护
minimumReleaseAgeExclude:
  - "@assistant-ui/*"
  - "assistant-cloud"
  - "@ai-sdk/openai-compatible@3.0.77"
  - "@ai-sdk/provider-utils@5.0.67"
  - "@ai-sdk/provider@4.0.33"
  - "@ai-sdk/anthropic@4.0.87"
  - "@ai-sdk/gateway@4.0.123"
  - "@ai-sdk/openai@4.0.101"
  - ai@7.0.150
  - assistant-stream@0.3.54
  - "@ai-sdk/mcp@2.0.83"
  - "@ai-sdk/react@4.0.154"

# 允许运行 build scripts 的依赖（pnpm 默认禁止，这里批准项目实际使用的原生/二进制包）
allowBuilds:
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true

# 统一 workspace 内共享第三方依赖版本（分包后 26 个包共同声明的依赖在此集中管理）。
# 各包 package.json 以 "catalog:" 引用，升级只改此处一处；保证解析到同一物理副本。
catalog:
  # runtime
  ai: 7.0.150
  zod: ^4.6.7
  pino: ^10.4.0
  yaml: ^2.6.0
  better-auth: ^1.7.3
  "@ai-sdk/provider": ^4.0.33
  "@ai-sdk/provider-utils": ^5.0.67
  "@vscode/ripgrep": ^1.18.0
  # db
  drizzle-orm: ^0.45.2
  "@libsql/client": ^0.17.0
  mysql2: ^3.11.0
  # dev 工具
  typescript: ^5.9.3
  vitest: ^4.1.12
  "@types/node": ^22.20.5

## 强制对齐两族依赖到单一物理副本，消除 web 端重复加载与类型分裂：
## 1) AI SDK 族：react/mcp 升级到 pin provider@4.0.33 的版本，避免旧版
##    react(4.0.152→ai@7.0.148) / mcp(2.0.81→provider@4.0.31) 引入第二份 ai / provider；
## 2) assistant-ui 族：core/store/assistant-cloud/assistant-stream 统一到 ai-sdk@0.0.15 所需的新版，
##    否则 react@0.15.29 取 core@0.3.29、ai-sdk@0.0.15 取 core@0.3.31，模块增强（MCP state）
##    与 useAuiState 各看一份 core，导致 AssistantState 类型分裂、web 无法通过 typecheck。
overrides:
  "@ai-sdk/react": 4.0.154
  "@ai-sdk/mcp": 2.0.83
  "@assistant-ui/core": 0.3.31
  "@assistant-ui/store": 0.3.22
  "@assistant-ui/tap": 0.9.24
  "assistant-cloud": 0.2.8
  "assistant-stream": 0.3.54
