packages:
  - "packages/*"
  - "examples/*"
  - "vico/*"

# 放行刚发布（未满 24h）的 assistant-ui 相关包，保留其余包的供应链保护
minimumReleaseAgeExclude:
  - "@assistant-ui/*"
  - "assistant-cloud"

# 允许运行 build scripts 的依赖（pnpm 默认禁止，这里批准项目实际使用的原生/二进制包）
allowBuilds:
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
