packages:
  - "packages/*"
  - "examples/*"
  - "vico/*"

# 放行 workspace 内 type-only 循环依赖（见 packages/core/SPLIT-PLAN.md）：
# model → tool → stream → model 中仅 tool → stream 为运行时 value 依赖，其余边
# 均为 `import type`，编译期擦除后不构成运行时环。
ignoreWorkspaceCycles: true

# 放行刚发布（未满 24h）的 assistant-ui 相关包，保留其余包的供应链保护
minimumReleaseAgeExclude:
  - "@assistant-ui/*"
  - "assistant-cloud"

# 允许运行 build scripts 的依赖（pnpm 默认禁止，这里批准项目实际使用的原生/二进制包）
allowBuilds:
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true

## 强制对齐 assistant-ui 核心包版本（ai-sdk/react-mcp 仍声明 ^0.3.25/^0.3.18，官方未发跟进版，
## 此处统一到 react@0.15.27 所需的 core 0.3.26 / store 0.3.19，消除运行时重复加载）
#overrides:
#  "@assistant-ui/core": 0.3.26
#  "@assistant-ui/store": 0.3.19
