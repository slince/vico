server:
  port: 3001
  deploy_mode: private

auth:
  session_expiry_days: 7

database:
  url: "file:./data/vico.db"
  duckdb_url: "./data/vico.duckdb"


skills:
  scan_paths:
    - "../skills"
    - "~/vico/skills"
  compatible: true

memory:
  stm_window: 20
  ltm_auto_extract: true
  ltm_max_entries: 10000
  semantic: libsql
  compaction:
    auto: true
    threshold_ratio: 0.8
    headroom_tokens: 65536
    retain_ratio: 0.16
    max_tokens: 65536
    compaction_retries: 1
    max_overflow_retries: 1

# 聊天模型全局默认上下文窗口（provider v4 不暴露 contextWindow，压缩判定用）
model:
  context_window: 131072

rag:
  chunk_size: 512
  chunk_overlap: 64
  retrieval_top_k: 5
  embedder: "none"

tool:
  timeout_ms: 30000

fs:
  base_path: '~/vico'

bash:
  backend: local
  contained: true
  allowed_paths: []
  timeout_ms: 30000
  isolation: none

# framework 存储后端（thread/checkpoint/vector 均持久化到 libsql，连接由 server 注入 db/client）
storage:
  thread: libsql
  checkpoint: libsql
  vector: libsql
  db_service: db
  client_service: client

# 应用层：知识库文件持久化存储
file_storage:
  type: local
  root: ./data/storage
  # ── S3 兼容模式 (Aliyun OSS / MinIO / AWS S3) 示例 ──
  # type: s3
  # root: knowledge-bases
  # endpoint: https://oss-cn-hangzhou.aliyuncs.com
  # region: cn-hangzhou
  # access_key_id: your-access-key
  # secret_access_key: your-secret-key
  # bucket: vico-storage

agent:
  max_cached: 100

checkpoint:
  ttl_days: 30
